<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>JobOne — Every job. One search.</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--ink:#14213d;--mute:#5c6678;--acc:#2f5bea;--line:#e3e6ef}
@media(prefers-color-scheme:dark){:root{--bg:#0e1424;--card:#171f36;--ink:#eef1fa;--mute:#9aa5bd;--acc:#7b9bff;--line:#27314f}}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--ink)}
header{padding:28px 16px 8px;max-width:760px;margin:auto}
h1{margin:0;font-size:28px}h1 span{color:var(--acc)}p.sub{color:var(--mute);margin:4px 0 16px}
form{display:grid;gap:8px;grid-template-columns:1fr}
@media(min-width:600px){form{grid-template-columns:2fr 1.3fr auto}}
input,button{font:inherit;padding:12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
button{background:var(--acc);color:#fff;border:0;font-weight:600;cursor:pointer}
main{max-width:760px;margin:auto;padding:8px 16px 40px}
#msg{color:var(--mute);margin:12px 0}
.job{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0}
.job h3{margin:0 0 4px;font-size:17px}.meta{color:var(--mute);font-size:14px}
.snip{margin:8px 0;font-size:14px;line-height:1.45}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row a,.row button{padding:8px 12px;border-radius:8px;font-size:14px;text-decoration:none}
.row a{background:var(--acc);color:#fff}.row button{background:transparent;color:var(--ink);border:1px solid var(--line)}
footer{text-align:center;color:var(--mute);font-size:13px;padding:16px}footer a{color:var(--acc)}
</style></head><body>
<header><h1>Job<span>One</span></h1><p class="sub">Every job. One search.</p>
<form id="f"><input id="q" placeholder="Job title or skill" required>
<input id="l" placeholder="City (e.g. Pune)"><button>Search</button></form></header>
<main><div id="msg">Search for a role to see live listings from India.</div>
<div id="res"></div><div class="row"><button id="more" hidden>Load more</button></div>
<h3>Saved</h3><div id="saved" class="meta"></div></main>
<footer>Jobs by <a href="https://www.adzuna.com" target="_blank" rel="noopener">Adzuna</a></footer>
<script>
// Set to your Render service URL (shown at the top of the service page on Render).
const API_BASE="https://jobone-api.onrender.com";
const $=id=>document.getElementById(id);
let page=1,query={q:"",l:""};
const store={get(){try{return JSON.parse(localStorage.getItem("jo_saved")||"[]")}catch{return[]}},
 set(v){try{localStorage.setItem("jo_saved",JSON.stringify(v))}catch{}}};
function renderSaved(){const s=store.get();$("saved").textContent=s.length?s.map(x=>x.title+" · "+x.company).join("  |  "):"No saved jobs yet."}
function card(j){
 const d=document.createElement("div");d.className="job";
 const h=document.createElement("h3");h.textContent=j.title;
 const m=document.createElement("div");m.className="meta";
 const sal=j.salaryMin?` · ₹${Math.round(j.salaryMin).toLocaleString("en-IN")}${j.salaryMax?"–"+Math.round(j.salaryMax).toLocaleString("en-IN"):""}`:"";
 m.textContent=[j.company,j.location].filter(Boolean).join(" · ")+sal;
 const sn=document.createElement("div");sn.className="snip";sn.textContent=(j.snippet||"").slice(0,220)+"…";
 const r=document.createElement("div");r.className="row";
 if(/^https?:\/\//.test(j.url)){const a=document.createElement("a");a.href=j.url;a.target="_blank";a.rel="noopener nofollow";a.textContent="Apply";r.append(a)}
 const b=document.createElement("button");
 const saved=()=>store.get().some(x=>x.id===j.id);
 const lab=()=>b.textContent=saved()?"♥ Saved":"♡ Save";lab();
 b.onclick=()=>{let s=store.get();s=saved()?s.filter(x=>x.id!==j.id):[...s,{id:j.id,title:j.title,company:j.company}];store.set(s);lab();renderSaved()};
 r.append(b);d.append(h,m,sn,r);return d}
async function load(reset){
 if(reset){page=1;$("res").textContent=""}
 $("msg").textContent="Searching… (the first search can take up to a minute while the server wakes up)";
 $("more").hidden=true;
 try{
  const u=new URL(API_BASE+"/api/jobs");u.searchParams.set("q",query.q);u.searchParams.set("location",query.l);u.searchParams.set("page",page);
  const r=await fetch(u);const d=await r.json();
  if(!r.ok)throw new Error(d.error||"Request failed");
  d.jobs.forEach(j=>$("res").append(card(j)));
  $("msg").textContent=d.jobs.length||page>1?`${d.total.toLocaleString("en-IN")} jobs found`:"No jobs found. Try different keywords.";
  $("more").hidden=d.jobs.length<20;
 }catch(e){$("msg").textContent="Couldn't load jobs: "+e.message}
}
$("f").onsubmit=e=>{e.preventDefault();query={q:$("q").value.trim(),l:$("l").value.trim()};load(true)};
$("more").onclick=()=>{page++;load(false)};
renderSaved();
</script></body></html>
